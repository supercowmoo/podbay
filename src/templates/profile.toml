# Podbay profile "{name}".
#
# Run with:  podbay run --profile {name} <project>
# Inspect:   podbay profile show {name}

# Profiles to build on. Their mounts, volumes, tools and extensions are
# applied first; entries here win when they target the same container path
# or tool.
{extends}

# Optional root build script, relative to this directory. It is baked into a
# derived image and run as root at build time, for system packages mise
# cannot install. It is never read from the project you mount.
# extension = "{name}.sh"

# Network access for the session: "none" (default, loopback only) or "full".
# Tool installs don't need it. podbay warns on every run with "full".
#
# network = "full"

# Capabilities the session keeps. None by default; each one weakens the
# boundary, and podbay prints them on every run.
#
# cap_add = ["SYS_PTRACE"]

# Bind mounts from the host. Best for files you edit on the host, such as
# dotfiles. mode is "ro" (default) or "rw". A missing host path is skipped
# with a warning.
#
# [[mount]]
# host = "~/.gitconfig"
# container = "/home/dev/.gitconfig"
# mode = "ro"

# The home directory is a fresh tmpfs every session.
#
# Named volumes that persist across runs, for state the container writes:
# tool config, auth, caches. Stored as podbay-{name}-<name>.
#
# [[volume]]
# name = "opencode-config"
# container = "/home/dev/.config/opencode"

# Tools mise installs for every project, on top of what the project asks
# for. They are installed in a provisioning step before the session starts.
#
# [tools]
# opencode = "latest"
# node = "22"

# Resource limits, overriding config.toml. pids = 0 means no limit.
#
# [limits]
# pids = 4096
# memory = "8g"
# cpus = 4
