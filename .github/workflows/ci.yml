name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Every action is pinned to a commit, not a tag, which can be moved. Only
# GitHub's own checkout is used; Rust comes from the runner's rustup.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain rust-toolchain.toml pins, through the runner's rustup.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Includes the end-to-end tests against the runner's docker, and one
      # that reaches a real host through a network allowlist.
      - run: cargo test --locked --workspace
        env:
          PODBAY_TEST_INTERNET: "1"
          PODBAY_TEST_REQUIRE_ENGINE: "1"

  podman:
    name: end-to-end tests on rootless podman
    # Pinned rather than ubuntu-latest: it decides the podman version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: podman info --format '{{.Version.Version}}, rootless {{.Host.Security.Rootless}}, cgroups {{.Host.CgroupsVersion}}'
      - run: cargo test --locked --test e2e
        env:
          PODBAY_TEST_BACKEND: podman
          PODBAY_TEST_INTERNET: "1"
          PODBAY_TEST_REQUIRE_ENGINE: "1"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck tests/fixtures/test-base/probe-install

  base-image:
    name: bundled base image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo run --locked --quiet -- build --backend docker
