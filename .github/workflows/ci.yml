name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the end-to-end tests against the runner's docker, and one
      # that reaches a real host through a network allowlist.
      - run: cargo test --workspace
        env:
          PODBAY_TEST_INTERNET: "1"
          PODBAY_TEST_REQUIRE_ENGINE: "1"

  podman:
    name: end-to-end tests on rootless podman
    # Pinned rather than ubuntu-latest: it decides the podman version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: podman info --format '{{.Version.Version}}, rootless {{.Host.Security.Rootless}}, cgroups {{.Host.CgroupsVersion}}'
      - run: cargo test --test e2e
        env:
          PODBAY_TEST_BACKEND: podman
          PODBAY_TEST_INTERNET: "1"
          PODBAY_TEST_REQUIRE_ENGINE: "1"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck tests/fixtures/test-base/probe-install

  base-image:
    name: bundled base image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -- build --backend docker
