[workspace]
members = ["relay", "init"]

[package]
name = "podbay"
version = "0.1.0"
edition = "2024"
description = "Disposable, isolated containers around a codebase"

# Exact versions, and Cargo.lock pins the rest with checksums. Build with
# --locked (`cargo install --locked --path .`) so nothing is resolved anew.
[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
