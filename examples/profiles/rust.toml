# Add to base image
extension = "rust.sh"

# The image comes first, so nothing in a volume can stand in for rustup.
# The volume's bin holds what you `cargo install`.
path = ["/opt/rustup/bin", "/home/dev/.cargo/bin"]

# crates.io for dependencies; static.rust-lang.org so `rustup update` and
# `rustup component add` work mid-session. Drop to keep the session offline:
# provisioning installs the toolchain and fetches Cargo.lock's crates anyway.
network = ["index.crates.io", "static.crates.io", "static.rust-lang.org"]

[env]
RUSTUP_HOME = "/home/dev/.rustup"
CARGO_HOME = "/home/dev/.cargo"

[[volume]]
name = "rustup"
container = "/home/dev/.rustup"
provision = true

[[volume]]
name = "cargo"
container = "/home/dev/.cargo"
provision = true

[provision]
# rustup lives in the read-only image, so it can't update itself: update it
# by rebuilding. Minimal profile plus clippy and rustfmt skips ~900 MB of
# offline docs per toolchain. Both settings are kept in the rustup volume.
command = """
rustup set auto-self-update disable
rustup set profile minimal
rustup default >/dev/null 2>&1 || rustup default stable
rustup show active-toolchain || rustup toolchain install
rustup component add clippy rustfmt
if [ -f Cargo.lock ]; then cargo fetch --locked; fi
"""
watch = ["rust-toolchain.toml", "rust-toolchain", "Cargo.lock"]
