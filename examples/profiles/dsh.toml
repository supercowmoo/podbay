# DeepSeek Harness (dsh), a coding agent with a web UI, using models from
# OpenRouter. Stack it with a language profile:
#
#   export OPENROUTER_API_KEY=...
#   podbay run -p rust -p dsh ~/src/my-rust-app -- dsh web --no-open
#
# then open the URL dsh prints; it carries the login token. `dsh headless
# "task"` instead of `dsh web` answers one task in the terminal.
#
# Copy dsh.sh along with this file: it bakes pinned versions of Node and
# dsh into the image, where a session can't change them. Also copy
# examples/dsh/cordis.patch.yml to ~/.config/podbay/dsh/: it picks
# OpenRouter and a model.

extension = "dsh.sh"
path = ["/opt/dsh/node/bin", "/opt/dsh/dsh/bin"]

# The key comes from your shell, for the session only. The session can
# reach OpenRouter and nothing else, so that's the only place it can go.
env_from_host = ["OPENROUTER_API_KEY"]
network = ["openrouter.ai"]

# The web UI. It asks for the token in the URL dsh prints, so other things
# on your machine can't drive it.
ports = [3080]

[env]
DSH_HOME = "/home/dev/.dsh"
# dsh uploads a session when you send feedback, unless this is set.
DSH_TELEMETRY_MODE = "DISABLED"

# Sessions, settings and the web UI's login secret.
[[volume]]
name = "home"
container = "/home/dev/.dsh"

# Provider and model, read-only, so the agent can't change them.
[[mount]]
host = "~/.config/podbay/dsh/cordis.patch.yml"
container = "/home/dev/.dsh/cordis.patch.yml"
